<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>함께한 추억 사진 공유하기</title>
  <script src="../version-check.js?v=20261013.1"></script>
  <link rel="stylesheet" href="./upload.css?v=20260921.1">
</head>
<body>
  <main>
    <p class="eyebrow">WEDDING MEMORIES</p>
    <h1>신랑 신부와 함께한<br>소중한 추억을 공유해 주세요.</h1>
    <p class="intro">함께한 순간을 사진으로 남겨주세요.<br>한 번에 최대 10장까지 올릴 수 있어요.</p>
    <form id="upload-form">
      <label class="picker" for="photos"><strong>사진 선택</strong><span id="file-label">사진을 선택해주세요 · 최대 10장</span></label>
      <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <div id="previews" class="previews" aria-live="polite"></div>
      <button id="submit" type="submit" disabled>사진 공유하기</button>
      <p id="status" role="status"></p>
    </form>
    <p class="notice">올린 사진은 두 사람의 소중한 기록으로 보관됩니다.</p>
  </main>
  <script type="module" src="./upload.js?v=20260921.1"></script>
</body>
</html>
